# Builds the CorAnTool desktop program for Windows, macOS and Linux and publishes it as a GitHub Release.
# Runs when a delivery tag (V0.1, V0.2…) is pushed (tools/release.sh does it), or by hand from the Actions tab
# (then only as downloadable artifacts). V0.40: no `release` trigger (a release made on the web also pushes its tag,
# which ran the build twice).
# The owner's private data is git-ignored, so it never reaches these builds.
name: Desktop builds

on:
  push:
    tags: ['V*']
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm test
      - run: pip install -e ".[dev]" && pytest -q
      - run: python tools/sync_version.py --check

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # unsigned builds (no paid certificates)
      - uses: actions/upload-artifact@v7
        with:
          name: corantool-${{ matrix.os }}
          if-no-files-found: error
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.deb

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only this job publishes
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          name: CorAnTool ${{ github.ref_name }}
          body_path: desktop/RELEASE_NOTES.md
          files: out/*
          overwrite_files: true
